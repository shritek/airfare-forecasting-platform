[project]
name = "airfare-forecasting-platform"
version = "0.1.0"
description = "Production-oriented airfare forecasting ML platform"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
airfare-profile-hf-atl = "airfare_forecasting.data.hf_atl_sqlite:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.uv]
required-version = ">=0.11.16,<0.13"

[tool.uv.build-backend]
module-name = "airfare_forecasting"

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "UP"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.14"
strict = true
warn_unreachable = true
